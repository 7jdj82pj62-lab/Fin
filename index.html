<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#EEF1F4">
<title>Patrimoine</title>
<style>
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#14202B; --muted:#5E6B78; --line:#D9DFE5;
  --accent:#1D4ED8; --up:#13795B; --down:#B42318;
  box-sizing:border-box; color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#10171E; --surface:#18222C; --ink:#E7EDF2; --muted:#93A1AE; --line:#2A3743;
        --accent:#7CA2FF; --up:#4CC9A0; --down:#FF8A7A; color-scheme:dark}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
main{max-width:640px;margin:0 auto;padding:16px 16px 28px}
h1{font-size:15px;font-weight:600;color:var(--muted);margin:0 0 6px}
h2{font-size:15px;font-weight:600;margin:24px 0 8px}
.total{font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.sub{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:15px}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.note.err{color:var(--down)}
.up{color:var(--up)} .down{color:var(--down)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.list>*+*{border-top:1px solid var(--line)}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;width:100%;padding:12px 14px;border:0;background:none;
  text-align:left;font:inherit;color:inherit}
button.row{cursor:pointer}
.row .l{min-width:0;flex:1}
.row .n,.n{font-weight:600}
.row .l .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m{font-size:13px;color:var(--muted)}
.r{text-align:right;flex:none}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.empty{padding:14px;color:var(--muted);font-size:15px}
.badge{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;flex:none}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
select{flex:1}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}
.full{grid-column:1/-1}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 14px;cursor:pointer;background:var(--accent);color:#fff}
.btn.alt{background:transparent;color:var(--muted);border:1px solid var(--line)}
@media (prefers-color-scheme:dark){.btn{color:#0B1220}.btn.alt{color:var(--muted)}}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.link{background:none;border:0;color:var(--accent);font:inherit;padding:6px 0;cursor:pointer}
.link.del{color:var(--down)}
details{margin-top:24px;font-size:14px;color:var(--muted)}
summary{cursor:pointer}
details input{margin:10px 0}
nav{position:sticky;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line)}
nav button{flex:1;font:inherit;font-size:12px;padding:12px 2px;background:none;border:0;color:var(--muted)}
nav button[aria-current]{color:var(--accent);font-weight:600}
nav button:disabled{opacity:.45}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>

<script>
"use strict";
const $ = s => document.querySelector(s);
const h = (t, a, ...c) => {
  const e = document.createElement(t);
  for(const k in a || {}){
    const v = a[k];
    if(k === 'class') e.className = v;
    else if(k.startsWith('on')) e[k] = v;
    else if(v != null && v !== false) e.setAttribute(k, v === true ? '' : v);
  }
  c.flat().forEach(x => x != null && e.append(x.nodeType ? x : document.createTextNode(x)));
  return e;
};
const ls = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- Modèle : enveloppes → lignes ---------- */
const TYPES = {
  pea:{n:'PEA', c:'Bourse', m:1}, cto:{n:'CTO', c:'Bourse', m:1}, crypto:{n:'Cryptos', c:'Crypto', m:1},
  es:{n:'Épargne salariale', c:'Épargne', mx:1}, av:{n:'Assurance vie', c:'Épargne', mx:1},
  la:{n:'Livret A', c:'Épargne', nc:1}, lj:{n:'Livret jeune', c:'Épargne', nc:1},
  cf:{n:'Immobilier crowdfunding', c:'Immobilier'}, im:{n:'Immobilier', c:'Immobilier'},
  au:{n:'Autres actifs (montres, voiture, or…)', c:'Autres'}
};
const CLASSES = ['Bourse', 'Crypto', 'Épargne', 'Immobilier', 'Autres'];
/* ligne cotée : {id,m:1,sym,name,qty,cost,divs[]}  ·  ligne manuelle : {id,name,val,cst,divs[]} */
let S = ls.get('pf.v1', null) || { envs:[], done:false, step:null, url: ls.get('pf0.url', '') };
let M = ls.get('pf.q', { q:{}, fx:{ EUR:1 }, t:null });
let failed = false, yes = false;
const save = () => ls.set('pf.v1', S);
const uid = () => Math.random().toString(36).slice(2, 9);

const E0 = new Intl.NumberFormat('fr-FR', { style:'currency', currency:'EUR', maximumFractionDigits:0 });
const E2 = new Intl.NumberFormat('fr-FR', { style:'currency', currency:'EUR' });
const P = new Intl.NumberFormat('fr-FR', { style:'percent', minimumFractionDigits:1, maximumFractionDigits:1, signDisplay:'exceptZero' });
const PP = new Intl.NumberFormat('fr-FR', { style:'percent', minimumFractionDigits:1, maximumFractionDigits:1 });
const P0 = new Intl.NumberFormat('fr-FR', { style:'percent', maximumFractionDigits:0 });
const N = new Intl.NumberFormat('fr-FR', { maximumFractionDigits:6 });
const sg = v => (v >= 0 ? '+' : '') + E0.format(v);
const cls = v => v >= 0 ? 'up' : 'down';
const money = (v, c) => { try{ return new Intl.NumberFormat('fr-FR', { style:'currency', currency:c, maximumFractionDigits:4 }).format(v); }catch(e){ return N.format(v) + ' ' + c; } };

/* ---------- Calculs ---------- */
function val(l){
  if(!l.m) return { v:l.val || 0, c:l.cst || 0, d:0 };
  const q = M.q[l.sym];
  if(!q || q.error || q.price == null) return null;
  const r = q.currency === 'EUR' ? 1 : M.fx[q.currency];
  if(!r) return null;
  return { v:q.price * l.qty * r, c:l.cost * l.qty * r, d:(q.price - q.prev) * l.qty * r };
}
const divs = l => (l.divs || []).reduce((a, d) => a + d.amt, 0);
function agg(lines){
  const o = { v:0, c:0, d:0, dv:0, miss:0 };
  lines.forEach(l => { const x = val(l); if(x){ o.v += x.v; o.c += x.c; o.d += x.d; } else o.miss++; o.dv += divs(l); });
  return o;
}
const allLines = () => S.envs.flatMap(e => e.lines);
const classEnvs = c => S.envs.filter(e => TYPES[e.type].c === c);

/* ---------- Cours (relais Apps Script) ---------- */
async function api(p){
  const r = await fetch(S.url + '?' + new URLSearchParams(p));
  if(!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  if(j.error) throw new Error(j.error);
  return j;
}
const norm = q => q.currency === 'GBp' ? { ...q, price:q.price / 100, prev:q.prev / 100, currency:'GBP' } : q;
async function refresh(){
  const syms = [...new Set(allLines().filter(l => l.m).map(l => l.sym))];
  if(!S.url || !syms.length) return;
  failed = false;
  try{
    const a = await api({ symbols:syms.join(',') });
    const q = {};
    for(const s in a.quotes) q[s] = a.quotes[s].error ? a.quotes[s] : norm(a.quotes[s]);
    const cur = [...new Set(Object.values(q).map(x => x.currency).filter(c => c && c !== 'EUR'))];
    const fx = { EUR:1 };
    if(cur.length){
      const b = await api({ symbols:cur.map(c => c + 'EUR=X').join(',') });
      cur.forEach(c => { const x = b.quotes[c + 'EUR=X']; fx[c] = x && x.price ? x.price : null; });
    }
    M = { q, fx, t:Date.now() }; ls.set('pf.q', M);
  }catch(e){ failed = true; }
  const t = document.activeElement && document.activeElement.tagName;
  if(t !== 'INPUT' && t !== 'SELECT') render();
}

/* ---------- Composants ---------- */
const go = x => { location.hash = x; };
const back = (href, t) => h('button', { class:'link', onclick:() => go(href) }, '‹ ' + t);
const numIn = () => h('input', { type:'number', inputmode:'decimal', step:'any', min:'0' });
const fld = (lab, i, full) => h('div', { class:full ? 'full' : null }, h('label', null, lab), i);
function head(title, a){
  const pv = a.v - a.c;
  return h('div', null, h('h1', null, title), h('div', { class:'total' }, E0.format(a.v)),
    h('div', { class:'sub' },
      a.c && Math.abs(pv) >= 0.5 ? h('span', { class:cls(pv) }, sg(pv) + ' de plus-value (' + P.format(pv / a.c) + ')') : null,
      a.dv ? h('span', null, E0.format(a.dv) + ' de dividendes') : null));
}
function note(a, lines){
  const hasM = (lines || allLines()).some(l => l.m);
  let t = '', err = false;
  if(hasM && !S.url){ t = 'Renseigne l’adresse du relais dans les réglages pour actualiser les cours.'; err = true; }
  else if(failed){ t = 'Actualisation impossible, derniers cours connus affichés.'; err = true; }
  else if(hasM && M.t) t = 'Cours actualisés le ' + new Date(M.t).toLocaleString('fr-FR', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }) + ' · décalage possible jusqu’à 20 min';
  if(a.miss) t += (t ? ' · ' : '') + a.miss + ' ligne(s) sans cours';
  return h('div', { class:'note' + (err ? ' err' : '') }, t);
}
function row(n, m, x, href){
  const pv = x.v - x.c;
  return h('button', { class:'row', onclick:() => go(href) },
    h('div', { class:'l' }, h('div', { class:'n' }, n), h('div', { class:'m' }, m)),
    h('div', { class:'r' }, h('div', { class:'n' }, E0.format(x.v)),
      x.c && Math.abs(pv) >= 0.5 ? h('div', { class:'m ' + cls(pv) }, sg(pv) + ' (' + P.format(pv / x.c) + ')') : null));
}

/* ---------- Écrans ---------- */
function vHome(){
  const a = agg(allLines());
  const d = h('div', null, head('Patrimoine brut', a), note(a), h('h2', null, 'Répartition'));
  const card = h('div', { class:'card list' });
  CLASSES.forEach((c, i) => {
    const es = classEnvs(c); if(!es.length) return;
    const x = agg(es.flatMap(e => e.lines)), part = a.v ? x.v / a.v : 0, pv = x.v - x.c;
    card.append(h('button', { class:'row', onclick:() => go('#/c/' + i) },
      h('div', { class:'l' }, h('div', { class:'n' }, c), h('div', { class:'m' }, P0.format(part) + ' du total'),
        h('div', { class:'bar' }, h('i', { style:'width:' + part * 100 + '%' }))),
      h('div', { class:'r' }, h('div', { class:'n' }, E0.format(x.v)), x.c && Math.abs(pv) >= 0.5 ? h('div', { class:'m ' + cls(pv) }, sg(pv)) : null)));
  });
  if(!card.children.length) card.append(h('div', { class:'empty' }, 'Ajoute une enveloppe pour voir ton patrimoine.'));
  d.append(card, addEnv(), settings());
  return d;
}
function vClass(i){
  const c = CLASSES[i]; if(!c) return vHome();
  const es = classEnvs(c), a = agg(es.flatMap(e => e.lines));
  const card = h('div', { class:'card list' });
  es.forEach(e => { const x = agg(e.lines); card.append(row(e.name, TYPES[e.type].n + ' · ' + P0.format(a.v ? x.v / a.v : 0) + ' de la classe', x, '#/e/' + e.id)); });
  return h('div', null, back('#/', 'Patrimoine'), head(c, a), h('h2', null, 'Enveloppes'), card);
}
function vEnv(id){
  const e = S.envs.find(x => x.id === id); if(!e) return vHome();
  const t = TYPES[e.type], a = agg(e.lines);
  const d = h('div', null, back('#/c/' + CLASSES.indexOf(t.c), t.c), head(e.name, a), note(a, e.lines));
  if(S.step != null) d.append(h('button', { class:'btn', style:'margin-top:14px', onclick:() => { S.step++; save(); go('#/o'); } }, 'Étape suivante du questionnaire'));
  d.append(h('h2', null, 'Lignes'));
  const card = h('div', { class:'card list' });
  e.lines.forEach(l => {
    const x = val(l);
    card.append(row(l.name, (l.m ? l.sym + ' · ' + N.format(l.qty) + ' parts' : '') + (x ? '' : ' · cours indisponible'), x || { v:0, c:0 }, '#/l/' + e.id + '/' + l.id));
  });
  if(!e.lines.length) card.append(h('div', { class:'empty' }, 'Aucune ligne pour l’instant.'));
  d.append(card);
  if(t.m || t.mx) d.append(h('h2', null, t.mx ? 'Ajouter des parts cotées (action, fonds coté…)' : 'Ajouter un titre'), searchBox(e));
  if(!t.m) d.append(h('h2', null, t.mx ? 'Ajouter un fonds (montant + plus-value)' : 'Ajouter un actif'),
    h('div', { class:'card' }, manualForm(e.type, l => { e.lines.push(l); save(); render(); }, '')));
  d.append(h('button', { class:'link del', style:'margin-top:20px', onclick:() => {
    if(confirm('Supprimer « ' + e.name + ' » et toutes ses lignes ?')){ S.envs = S.envs.filter(x => x !== e); save(); go('#/'); }
  } }, 'Supprimer cette enveloppe'));
  return d;
}
function vLine(eid, lid){
  const e = S.envs.find(x => x.id === eid), l = e && e.lines.find(x => x.id === lid); if(!l) return vHome();
  const x = val(l) || { v:0, c:0, d:0 }, dv = divs(l), t = TYPES[e.type];
  const d = h('div', null, back('#/e/' + eid, e.name), head(l.name, { v:x.v, c:x.c, dv }));
  if(l.m){
    const q = M.q[l.sym];
    if(q && q.price != null) d.append(h('div', { class:'note' }, 'Dernier cours : ' + money(q.price, q.currency) + ' · ' + P.format((q.price - q.prev) / q.prev) + ' sur la séance'));
  }
  const ed = l.m ? [['Nombre de parts', 'qty'], ['Prix d’achat moyen', 'cost']] : [['Montant actuel (€)', 'val']].concat(t.nc ? [] : [['Prix d’achat (€)', 'cst']]);
  const ins = ed.map(([lab, k]) => { const i = numIn(); i.value = l[k]; return [lab, k, i]; });
  const pvI = (!l.m && !t.nc) ? h('input', { type:'number', inputmode:'decimal', step:'any' }) : null;
  if(pvI) pvI.value = +((l.val || 0) - (l.cst || 0)).toFixed(2);
  const pv0 = pvI && pvI.value;
  d.append(h('h2', null, 'Position'), h('div', { class:'card form' }, ...ins.map(([lab, , i]) => fld(lab, i)), pvI ? fld('ou plus-value (€)', pvI) : null,
    h('button', { class:'btn full', onclick:() => {
      ins.forEach(([, k, i]) => { const n = parseFloat(i.value); if(n >= 0) l[k] = n; });
      if(pvI && pvI.value !== pv0){ const p = parseFloat(pvI.value); if(!isNaN(p)) l.cst = l.val - p; }
      if(t.nc && !l.m) l.cst = l.val;
      save(); render(); refresh();
    } }, 'Enregistrer')));
  d.append(h('h2', null, 'Dividendes perçus'));
  const dc = h('div', { class:'card list' });
  (l.divs || []).slice().sort((a, b) => b.d.localeCompare(a.d)).forEach(dd => dc.append(h('div', { class:'row' },
    h('div', { class:'l' }, h('div', { class:'n' }, E2.format(dd.amt)), h('div', { class:'m' }, new Date(dd.d).toLocaleDateString('fr-FR'))),
    h('button', { class:'link', onclick:() => { l.divs = l.divs.filter(z => z !== dd); save(); render(); } }, 'Retirer'))));
  if(!dc.children.length) dc.append(h('div', { class:'empty' }, 'Aucun dividende noté.'));
  d.append(dc);
  if(dv && x.c) d.append(h('div', { class:'note' }, 'Rendement perçu : ' + PP.format(dv / x.c) + ' du prix d’achat'));
  const dt = h('input', { type:'date', value:new Date().toISOString().slice(0, 10) }), am = numIn();
  d.append(h('div', { class:'card form', style:'margin-top:12px' }, fld('Date', dt), fld('Montant reçu (€)', am),
    h('button', { class:'btn full', onclick:() => {
      const n = parseFloat(am.value); if(!(n > 0) || !dt.value){ am.focus(); return; }
      (l.divs = l.divs || []).push({ d:dt.value, amt:n }); save(); render();
    } }, 'Ajouter le dividende')));
  d.append(h('button', { class:'link del', style:'margin-top:20px', onclick:() => {
    if(confirm('Supprimer « ' + l.name + ' » ?')){ e.lines = e.lines.filter(z => z !== l); save(); go('#/e/' + eid); }
  } }, 'Supprimer cette ligne'));
  return d;
}
function vOnb(){
  const keys = Object.keys(TYPES);
  if(S.step >= keys.length){ S.step = null; S.done = true; save(); history.replaceState(null, '', '#/'); return vHome(); }
  const type = keys[S.step], t = TYPES[type];
  const next = () => { S.step++; yes = false; save(); render(); };
  const d = h('div', null, h('h1', null, 'État des lieux · ' + (S.step + 1) + ' sur ' + keys.length),
    h('div', { class:'bar' }, h('i', { style:'width:' + (S.step / keys.length * 100) + '%' })),
    h('div', { class:'total', style:'font-size:28px;margin-top:18px' }, t.n));
  if(!yes){
    d.append(h('div', { class:'note' }, 'Possèdes-tu cette enveloppe ou ce type d’actif ?'),
      h('div', { class:'btns', style:'margin-top:14px' },
        h('button', { class:'btn', onclick:() => {
          if(t.m){ const id = uid(); S.envs.push({ id, type, name:t.n, lines:[] }); save(); go('#/e/' + id); } else { yes = true; render(); }
        } }, 'Oui'),
        h('button', { class:'btn alt', onclick:next }, 'Non'),
        S.step ? h('button', { class:'link', onclick:() => { S.step--; save(); render(); } }, 'Précédent') : null));
  }else{
    d.append(h('div', { class:'card', style:'margin-top:14px' }, manualForm(type, l => { S.envs.push({ id:uid(), type, name:t.n, lines:[l] }); next(); }, t.n)));
  }
  d.append(h('button', { class:'link', style:'margin-top:24px', onclick:() => { S.step = null; S.done = true; yes = false; save(); go('#/'); render(); } }, 'Passer le questionnaire'));
  return d;
}

/* ---------- Formulaires ---------- */
function manualForm(type, done, dn){
  const t = TYPES[type], nm = h('input', { type:'text', value:dn || '', placeholder:'Nom de l’actif' }), v = numIn(), c = numIn();
  const p = h('input', { type:'number', inputmode:'decimal', step:'any', placeholder:'ex. 250 ou -120' });
  const ok = h('button', { class:'btn full', onclick:() => {
    const val = parseFloat(v.value);
    let cst = val;
    if(!t.nc){ if(c.value !== '') cst = parseFloat(c.value); else if(p.value !== '') cst = val - parseFloat(p.value); }
    if(!nm.value.trim()){ nm.focus(); return; }
    if(!(val >= 0) || isNaN(cst)){ v.focus(); return; }
    done({ id:uid(), name:nm.value.trim(), val, cst, divs:[] });
  } }, 'Ajouter');
  return h('div', { class:'form' }, fld('Nom', nm, 1), fld('Montant actuel (€)', v), t.nc ? null : fld('Prix d’achat (€)', c), t.nc ? null : fld('ou plus-value (€)', p), ok);
}
function searchBox(e){
  const box = h('div', { class:'list' }), cache = new Map();
  let timer, seq = 0;
  const inp = h('input', { type:'search', placeholder:'Nom, symbole ou ISIN…', autocomplete:'off', autocapitalize:'off' });
  const msg = t => box.replaceChildren(h('div', { class:'empty' }, t));
  const pick = r => {
    const qty = numIn(), cost = numIn(), lab = h('label', null, 'Prix d’achat moyen');
    const add = () => {
      const n = parseFloat(qty.value), c = parseFloat(cost.value);
      if(!(n > 0) || !(c >= 0)){ qty.focus(); return; }
      e.lines.push({ id:uid(), m:1, sym:r.symbol, name:r.name, qty:n, cost:c, divs:[] }); save(); render(); refresh();
    };
    box.replaceChildren(h('div', { class:'form' },
      h('div', { class:'full' }, h('div', { class:'n' }, r.name), h('div', { class:'m' }, r.symbol + ' · ' + r.exchange)),
      fld('Nombre de parts', qty), h('div', null, lab, cost),
      h('button', { class:'btn', onclick:add }, 'Ajouter'), h('button', { class:'btn alt', onclick:() => box.replaceChildren() }, 'Annuler')));
    api({ symbols:r.symbol }).then(a => { const q = a.quotes[r.symbol]; if(q && q.currency) lab.textContent = 'Prix d’achat moyen (' + (q.currency === 'GBp' ? 'GBP' : q.currency) + ')'; }).catch(() => {});
    qty.focus();
  };
  const show = rs => {
    if(!rs.length) return msg('Aucun résultat. Essaie le symbole ou un autre mot du nom.');
    box.replaceChildren(...rs.map(r => h('button', { class:'row', onclick:() => pick(r) },
      h('div', { class:'l' }, h('div', { class:'n' }, r.name), h('div', { class:'m' }, r.symbol + ' · ' + r.exchange)), h('div', { class:'badge' }, r.type))));
  };
  inp.oninput = () => {
    clearTimeout(timer); seq++;
    const v = inp.value.trim(); if(v.length < 2){ box.replaceChildren(); return; }
    const k = v.toLowerCase();
    if(cache.has(k)) return show(cache.get(k));
    if(!S.url) return msg('Renseigne d’abord l’adresse du relais (réglages, sur l’écran d’accueil).');
    msg('Recherche…');
    timer = setTimeout(async () => {
      const my = ++seq;
      try{ const { results } = await api({ action:'search', q:v }); if(my !== seq) return; if(results.length) cache.set(k, results); show(results); }
      catch(x){ if(my === seq) msg('Recherche impossible (' + x.message + ').'); }
    }, 180);
  };
  return h('div', { class:'card list' }, h('div', { style:'padding:10px' }, inp), box);
}
function addEnv(){
  const sel = h('select', null, ...Object.entries(TYPES).map(([k, t]) => h('option', { value:k }, t.n)));
  return h('div', { class:'btns', style:'margin-top:16px;flex-wrap:nowrap' }, sel, h('button', { class:'btn', onclick:() => {
    const k = sel.value, n = S.envs.filter(e => e.type === k).length, id = uid();
    S.envs.push({ id, type:k, name:TYPES[k].n + (n ? ' ' + (n + 1) : ''), lines:[] }); save(); go('#/e/' + id);
  } }, 'Ajouter'));
}
function exportData(){
  const a = h('a', { href:URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], { type:'application/json' })), download:'patrimoine-' + new Date().toISOString().slice(0, 10) + '.json' });
  document.body.append(a); a.click(); a.remove();
}
function settings(){
  const u = h('input', { type:'url', placeholder:'https://script.google.com/macros/s/…/exec', autocapitalize:'off' });
  u.value = S.url || '';
  const file = h('input', { type:'file', accept:'application/json', style:'display:none' });
  file.onchange = () => {
    const f = file.files[0]; if(!f) return;
    f.text().then(t => { const o = JSON.parse(t); if(!o || !Array.isArray(o.envs)) throw 0; S = o; save(); go('#/'); render(); refresh(); })
      .catch(() => alert('Fichier non reconnu.'));
  };
  return h('details', { open:!S.url }, h('summary', null, 'Réglages et sauvegarde'), u,
    h('div', { class:'btns' },
      h('button', { class:'btn', onclick:() => { S.url = u.value.trim(); save(); refresh(); render(); } }, 'Enregistrer l’adresse'),
      h('button', { class:'btn alt', onclick:exportData }, 'Exporter mes données'),
      h('button', { class:'btn alt', onclick:() => file.click() }, 'Importer'), file),
    h('div', { class:'note' }, 'Les données restent sur cet appareil. Exporte-les régulièrement pour les sauvegarder.'));
}

/* ---------- Patrimoine net : frais et impôts ---------- */
const fp = e => agg(e.lines).v * (e.fee || 0) / 100, fx = e => e.fix || 0, fees = e => fp(e) + fx(e);
const taxe = e => { const a = agg(e.lines); return Math.max(0, a.v - a.c) * (e.tax || 0) / 100; };
const todo = e => e.fee == null && e.fix == null && e.tax == null;
const sums = es => es.reduce((o, e) => { o.p += fp(e); o.x += fx(e); o.f += fees(e); o.t += taxe(e); return o; }, { p:0, x:0, f:0, t:0 });

function vNet(){
  const a = agg(allLines()), s = sums(S.envs), net = a.v - s.t, pc = x => a.v ? PP.format(x / a.v) : '–';
  const d = h('div', null, h('h1', null, 'Patrimoine net'), h('div', { class:'total' }, E0.format(net)),
    h('div', { class:'sub' }, h('span', null, 'Brut ' + E0.format(a.v)), h('span', { class:'down' }, E0.format(s.t) + ' d’impôts latents'), h('span', { class:'down' }, E0.format(s.f) + ' de frais par an')));
  if(!S.envs.length){ d.append(h('div', { class:'note' }, 'Ajoute d’abord tes enveloppes dans l’onglet Brut.')); return d; }
  d.append(h('div', { class:'bar', style:'height:10px;margin-top:14px' }, h('i', { style:'width:' + (a.v ? net / a.v * 100 : 0) + '%' })),
    h('div', { class:'note' }, 'Impôts latents : ' + pc(s.t) + ' du brut · Frais : ' + pc(s.f) + ' du patrimoine chaque année'));
  const n = S.envs.filter(todo).length;
  if(n) d.append(h('div', { class:'note err' }, n + ' enveloppe(s) sans frais ni impôts renseignés : ouvre une classe ci-dessous.'));
  d.append(h('h2', null, 'Par classe d’actifs'));
  const card = h('div', { class:'card list' });
  CLASSES.forEach((c, i) => {
    const es = classEnvs(c); if(!es.length) return;
    const x = sums(es), g = agg(es.flatMap(e => e.lines));
    card.append(h('button', { class:'row', onclick:() => go('#/n/c/' + i) },
      h('div', { class:'l' }, h('div', { class:'n' }, c), h('div', { class:'m' }, E0.format(g.v) + ' brut')),
      h('div', { class:'r' }, h('div', { class:'n down' }, E0.format(x.f) + ' /an'), h('div', { class:'m' }, E0.format(x.t) + ' d’impôts latents'))));
  });
  d.append(card, projCard(a.v, s));
  return d;
}
function vNetClass(i){
  const c = CLASSES[i]; if(!c) return vNet();
  const es = classEnvs(c), x = sums(es);
  const card = h('div', { class:'card list' });
  es.forEach(e => {
    const g = agg(e.lines), f = fees(e);
    card.append(h('button', { class:'row', onclick:() => go('#/n/e/' + e.id) },
      h('div', { class:'l' }, h('div', { class:'n' }, e.name), h('div', { class:'m' }, todo(e) ? 'Frais et impôts à renseigner' : E0.format(g.v) + ' brut · ' + (g.v ? PP.format(f / g.v) : '–') + ' de frais/an')),
      h('div', { class:'r' }, h('div', { class:'n down' }, E0.format(f) + ' /an'), h('div', { class:'m' }, E0.format(taxe(e)) + ' d’impôts'))));
  });
  return h('div', null, back('#/n', 'Patrimoine net'), h('h1', null, c), h('div', { class:'total' }, E0.format(x.f) + ' /an'),
    h('div', { class:'sub' }, h('span', null, E0.format(x.t) + ' d’impôts latents')), h('h2', null, 'Enveloppes'), card);
}
function vNetEnv(id){
  const e = S.envs.find(x => x.id === id); if(!e) return vNet();
  const g = agg(e.lines), c = TYPES[e.type].c, up = '#/n/c/' + CLASSES.indexOf(c);
  const mk = (k, ph) => { const i = h('input', { type:'number', inputmode:'decimal', step:'any', min:'0', placeholder:ph }); if(e[k] != null) i.value = e[k]; return i; };
  const fee = mk('fee', '0'), fix = mk('fix', '0'), tax = mk('tax', '0');
  return h('div', null, back(up, c), h('h1', null, e.name), h('div', { class:'total' }, E0.format(fees(e)) + ' /an'),
    h('div', { class:'sub' }, h('span', null, E0.format(taxe(e)) + ' d’impôts latents sur ' + E0.format(Math.max(0, g.v - g.c)) + ' de plus-value')),
    h('h2', null, 'Frais et impôts'),
    h('div', { class:'card form' }, fld('Frais de gestion annuels (% de l’encours)', fee), fld('Frais fixes annuels (€)', fix), fld('Impôt sur la plus-value (%)', tax, 1),
      h('button', { class:'btn full', onclick:() => {
        [['fee', fee], ['fix', fix], ['tax', tax]].forEach(([k, i]) => { const n = parseFloat(i.value); if(i.value === '') delete e[k]; else if(n >= 0) e[k] = n; });
        save(); go(up);
      } }, 'Enregistrer')),
    h('div', { class:'note' }, 'Les taux dépendent de l’enveloppe et de ta situation (ancienneté, tranche, régime). Renseigne ceux de ton contrat.'));
}
function vNetR(a, b){ return a === 'c' ? vNetClass(b) : a === 'e' ? vNetEnv(b) : vNet(); }

function projCard(v, s){
  const st = S.proj || (S.proj = { r:5, n:20 }), nI = numIn(), rI = numIn(), out = h('div');
  nI.value = st.n; rI.value = st.r; rI.removeAttribute('min');
  const upd = () => {
    const n = Math.min(60, Math.max(1, parseInt(nI.value) || st.n)), r = parseFloat(rI.value);
    st.n = n; if(!isNaN(r)) st.r = r; save(); out.replaceChildren(...projOut(v, s, st));
  };
  nI.oninput = rI.oninput = upd; upd();
  return h('div', null, h('h2', null, 'Projection des frais composés'),
    h('div', { class:'card form' }, fld('Horizon (années)', nI), fld('Rendement brut annuel (%, hypothèse)', rI)), out);
}
function projOut(v, s, st){
  if(!v) return [h('div', { class:'note' }, 'Ajoute du patrimoine pour lancer la simulation.')];
  const r = st.r / 100, rate = s.p / v, A = [v], B = [v];
  let a = v, b = v, paid = 0;
  for(let y = 1; y <= st.n; y++){
    a *= 1 + r; const f = b * rate + s.x; b = Math.max(0, b * (1 + r) - f); paid += f; A.push(a); B.push(b);
  }
  const cost = a - b, W = 320, H = 120, mx = Math.max(...A) || 1, pts = z => z.map((q, i) => (i / (z.length - 1) * W).toFixed(1) + ',' + (H - q / mx * H).toFixed(1)).join(' ');
  const svg = h('div'); svg.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Capital avec et sans frais" style="display:block;overflow:visible;margin:14px 0 6px">' +
    '<polyline fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 4" points="' + pts(A) + '"/>' +
    '<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="' + pts(B) + '"/></svg>';
  const line = (k, x, c) => h('div', { class:'row' }, h('div', { class:'l' }, k), h('div', { class:'r n ' + (c || '') }, E0.format(x)));
  return [h('div', { class:'card list', style:'margin-top:12px' }, line('Capital sans frais (pointillé)', a), line('Capital avec frais', b), line('Coût total des frais', cost, 'down')),
    svg, h('div', { class:'note' }, 'Sur ' + st.n + ' ans : ' + E0.format(paid) + ' de frais payés et ' + E0.format(Math.max(0, cost - paid)) + ' de croissance perdue. Simulation sur ton patrimoine actuel, sans nouveaux versements.')];
}

/* ---------- Routeur ---------- */
function render(){
  if(!S.done && S.step == null && !S.envs.length){ S.step = 0; save(); }
  const r = (location.hash || '#/').slice(2).split('/');
  let k = r[0];
  if(S.step != null && !k) k = 'o';
  if(k === 'o' && S.step == null) k = '';
  const V = { o:vOnb, c:vClass, e:vEnv, l:vLine, n:vNetR }[k] || vHome;
  $('#app').replaceChildren(V(...r.slice(1)));
  navR(k);
}
function navR(k){
  $('#nav').replaceChildren(...[['Brut', 1, '#/'], ['Net', 1, '#/n'], ['Stratégie'], ['Objectifs'], ['Outils']].map(([n, on, hr], i) =>
    h('button', { disabled:!on, 'aria-current':on && ((i === 1) === (k === 'n')) ? 'page' : null, title:on ? null : 'Bientôt', onclick:on ? () => go(hr) : null }, n)));
}
window.onhashchange = () => { render(); window.scrollTo(0, 0); };
render(); refresh();
if(S.url) api({ action:'ping' }).catch(() => {});
setInterval(refresh, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if(!document.hidden && (!M.t || Date.now() - M.t > 5 * 60 * 1000)) refresh(); });
</script>
