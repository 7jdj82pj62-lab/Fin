<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#EEF1F4">
<title>Patrimoine</title>
<script>
window.addEventListener('error', function(e){
  var a = document.getElementById('app');
  if(!a || (a.children.length && a.textContent.trim() !== 'Chargement…')) return;
  a.textContent = 'Erreur de l’application : ' + (e.message || 'inconnue') + '. Rafraîchissez la page sans vider les données.';
});
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
document.addEventListener('gesturechange', function(e){ e.preventDefault(); });
</script>
<style>
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#14202B; --muted:#5E6B78; --line:#D9DFE5;
  --accent:#1D4ED8; --up:#13795B; --down:#DC2626; --warn:#B26A00;
  --c0:#2F5BE0; --c1:#E08A1E; --c2:#1E9E78; --c3:#8A5CD0; --c4:#7C8A99;
  box-sizing:border-box; color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#10171E; --surface:#18222C; --ink:#E7EDF2; --muted:#93A1AE; --line:#2A3743;
        --accent:#7CA2FF; --up:#4CC9A0; --down:#EF4444; --warn:#F0A94A;
        --c0:#7CA2FF; --c1:#F0A94A; --c2:#4CC9A0; --c3:#B28CF0; --c4:#9AA7B4; color-scheme:dark}
}
*{box-sizing:border-box; touch-action:manipulation}
html, body{
  margin:0; padding:0; background:var(--bg); color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums; -webkit-text-size-adjust:100%;
  overflow-x:hidden !important; width:100%; max-width:100vw;
}
main{max-width:640px; margin:0 auto; padding:16px 16px 85px; width:100%; overflow-x:hidden}
h1{font-size:15px; font-weight:600; color:var(--muted); margin:0 0 6px}
h2{font-size:13px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin:24px 0 8px}
.total{font-size:32px; font-weight:700; letter-spacing:-.02em; line-height:1.1}
.sub{display:flex; flex-wrap:wrap; gap:4px 14px; margin-top:6px; font-size:14px}
.note{font-size:13px; color:var(--muted); margin-top:8px}
.note.err{color:var(--down)}
.up{color:var(--up)} .down{color:var(--down)}
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden}
.list>*+*{border-top:1px solid var(--line)}
.row{display:flex; justify-content:space-between; gap:12px; align-items:center; width:100%; padding:14px; border:0; background:none; text-align:left; font:inherit; color:inherit}
button.row{cursor:pointer; transition:background .15s}
button.row:hover{background:rgba(127,127,127,.08)}
button.row:active{background:rgba(127,127,127,.18)}
button.row::after{content:'›'; font-size:22px; line-height:1; color:var(--muted); margin-left:2px; flex:none}
.row .l{min-width:0; flex:1}
.row .n{font-weight:600}
.row .l .n{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.m{font-size:13px; color:var(--muted)}
.r{text-align:right; flex:none}
.bar{height:6px; border-radius:3px; background:var(--line); margin-top:8px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--accent)}
.empty{padding:14px; color:var(--muted); font-size:14px}
.badge{font-size:12px; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:2px 8px; flex:none}
.badge.green{color:var(--up); border-color:var(--up); background:rgba(19,121,91,0.08); font-weight:600}

/* Forçage strict de la police à 16px sur les champs pour éviter le zoom automatique iOS */
input, select{
  width:100%; font-size:16px !important; font-family:inherit; color:var(--ink);
  background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px;
}
select{flex:1}
input[type=checkbox], input[type=radio]{width:auto; height:18px; width:18px}
input:focus-visible, select:focus-visible, button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.form{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:14px}
.full{grid-column:1/-1}
label{display:block; font-size:13px; color:var(--muted); margin-bottom:4px}
.btn{font-size:15px; font-weight:600; border:0; border-radius:12px; padding:12px 14px; cursor:pointer; background:var(--accent); color:#fff; text-align:center; transition:opacity .15s}
.btn:active{opacity:.85}
.btn.alt{background:transparent; color:var(--muted); border:1px solid var(--line)}

/* Boutons de suppression / danger : FOND ROUGE avec TEXTE BLANC TRÈS LISIBLE */
.btn.danger, .btn-del, .btn-danger{
  background: var(--down) !important;
  color: #FFFFFF !important;
  font-weight: 700 !important;
  border: 0 !important;
  box-shadow: 0 2px 6px rgba(220, 38, 38, 0.25);
  text-shadow: none !important;
}
.btn.danger:hover, .btn-del:hover{
  background: #B91C1C !important;
}
.btn.danger:active, .btn-del:active{
  background: #991B1B !important;
}

/* Boutons d'action unitaire de suppression (badge rouge compact avec texte blanc) */
.btn-del{
  font-size: 12px !important;
  padding: 6px 12px !important;
  border-radius: 8px !important;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
}

@media (prefers-color-scheme:dark){
  .btn{color:#0B1220}
  .btn.alt{color:var(--muted)}
  .btn.danger, .btn-del, .btn-danger{color:#FFFFFF !important}
}

.btns{display:flex; flex-wrap:wrap; gap:10px}
.link{background:none; border:0; color:var(--accent); font:inherit; padding:6px 0; cursor:pointer}
.tiles{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px}
.tile{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 14px; min-width:0}
.tile.w2{grid-column:1/-1}
.tile .k{font-size:12px; color:var(--muted)}
.tile .v{font-size:20px; font-weight:700; margin-top:2px; letter-spacing:-.01em}
.tile .s{font-size:12px; color:var(--muted); margin-top:2px}
.seg{display:flex; height:12px; border-radius:6px; overflow:hidden; gap:2px; margin-top:4px}
.seg i{display:block; height:100%; min-width:3px}
.dot{display:inline-block; width:10px; height:10px; border-radius:50%; flex:none}
.toast{position:fixed; left:16px; right:16px; bottom:calc(76px + env(safe-area-inset-bottom,0px)); max-width:608px; margin:0 auto; background:var(--ink); color:var(--bg); padding:12px 14px; border-radius:12px; font-size:14px; z-index:99; box-shadow:0 6px 20px rgba(0,0,0,.25)}

/* Navigation compacte */
nav{position:fixed; bottom:0; left:0; right:0; display:flex; background:var(--surface); border-top:1px solid var(--line); z-index:90; padding-bottom:env(safe-area-inset-bottom,0px)}
nav a{flex:1; text-align:center; font-size:11px; padding:8px 0 10px; color:var(--muted); text-decoration:none; display:flex; flex-direction:column; align-items:center; gap:3px}
nav a[aria-current]{color:var(--accent); font-weight:600}
nav a svg{width:20px; height:20px; fill:currentColor}

/* Modales */
.modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:flex-end; justify-content:center; z-index:100; backdrop-filter:blur(3px)}
.modal-content{background:var(--surface); border-radius:20px 20px 0 0; width:100%; max-width:640px; max-height:85vh; overflow-y:auto; padding:20px; box-shadow:0 -10px 25px rgba(0,0,0,.2)}
</style>
</head>
<body>
<main id="app">Chargement…</main>
<nav id="nav"></nav>
<div id="modal-root"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const _append = Element.prototype.append, _replace = Element.prototype.replaceChildren;
Element.prototype.append = function(...n){ return _append.apply(this, n.filter(x => x != null && x !== false)); };
Element.prototype.replaceChildren = function(...n){ return _replace.apply(this, n.filter(x => x != null && x !== false)); };

const pf = v => { const t = String(v == null ? '' : v).replace(/\s/g, '').replace(',', '.'); return t === '' ? NaN : parseFloat(t); };

const h = (t, a, ...c) => {
  const e = document.createElement(t);
  for(const k in a || {}){
    const v = a[k];
    if(k === 'class') e.className = v;
    else if(k.startsWith('on')) e[k] = v;
    else if(v != null && v !== false) e.setAttribute(k, v === true ? '' : v);
  }
  c.flat().forEach(x => x != null && e.append(x.nodeType ? x : document.createTextNode(x)));
  return e;
};

const ls = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

const TYPES = {
  pea:{n:'PEA', c:'Bourse', m:1}, cto:{n:'CTO', c:'Bourse', m:1}, crypto:{n:'Cryptos', c:'Crypto', m:1},
  es:{n:'Épargne salariale', c:'Épargne', mx:1}, av:{n:'Assurance vie', c:'Épargne', mx:1},
  la:{n:'Livret A', c:'Épargne', nc:1}, lj:{n:'Livret jeune', c:'Épargne', nc:1},
  cf:{n:'Immobilier crowdfunding', c:'Immobilier'}, im:{n:'Immobilier', c:'Immobilier'},
  au:{n:'Autres actifs', c:'Autres'}
};
const CLASSES = ['Bourse', 'Crypto', 'Épargne', 'Immobilier', 'Autres'];

let S = ls.get('pf.v1', null) || { envs:[], done:false, step:null, url: ls.get('pf0.url', '') };
if(!S || typeof S !== 'object') S = { envs:[], done:false, step:null, url:'' };
if(!Array.isArray(S.envs)) S.envs = [];
let M = ls.get('pf.q', { q:{}, fx:{ EUR:1 }, t:null });
let failed = false;
const save = () => ls.set('pf.v1', S);
const uid = () => Math.random().toString(36).slice(2, 9);

const E0 = new Intl.NumberFormat('fr-FR', { style:'currency', currency:'EUR', maximumFractionDigits:0 });
const E2 = new Intl.NumberFormat('fr-FR', { style:'currency', currency:'EUR' });
const P = new Intl.NumberFormat('fr-FR', { style:'percent', minimumFractionDigits:1, maximumFractionDigits:1, signDisplay:'exceptZero' });
const PP = new Intl.NumberFormat('fr-FR', { style:'percent', minimumFractionDigits:1, maximumFractionDigits:1 });
const P0 = new Intl.NumberFormat('fr-FR', { style:'percent', maximumFractionDigits:0 });
const N = new Intl.NumberFormat('fr-FR', { maximumFractionDigits:4 });
const sg = v => (v >= 0 ? '+' : '') + E0.format(v);
const cls = v => v >= 0 ? 'up' : 'down';
const fr1 = v => (typeof v === 'number' && isFinite(v) ? v.toFixed(1).replace('.', ',') : '–');

const numIn = (ph) => h('input', { type:'text', inputmode:'decimal', step:'any', placeholder: ph || '0' });
const intIn = (ph) => h('input', { type:'text', inputmode:'numeric', pattern:'[0-9]*', placeholder: ph || '0' });

function val(l){
  if(!l.m) return { v:l.val || 0, c:l.cst || 0, d:0 };
  const q = M.q[l.sym];
  if(!q || q.error || q.price == null) return null;
  const r = q.currency === 'EUR' ? 1 : M.fx[q.currency];
  if(!r) return null;
  return { v:q.price * l.qty * r, c:l.cost * l.qty, d:(q.price - q.prev) * l.qty * r };
}

/* Calcul du cumul des dividendes d'une ligne */
const divs = l => (l.divs || []).reduce((a, d) => a + (d.amt || 0), 0);

function agg(lines){
  const o = { v:0, c:0, d:0, dv:0, miss:0 };
  lines.forEach(l => {
    const x = val(l);
    if(x){ o.v += x.v; o.c += x.c; o.d += x.d; } else o.miss++;
    o.dv += divs(l);
  });
  return o;
}
const allLines = () => S.envs.flatMap(e => e.lines);
const classEnvs = c => S.envs.filter(e => TYPES[e.type].c === c);

async function api(p){
  const r = await fetch(S.url + '?' + new URLSearchParams(p));
  if(!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  if(j.error) throw new Error(j.error);
  return j;
}
const norm = q => q.currency === 'GBp' ? { ...q, price:q.price / 100, prev:q.prev / 100, currency:'GBP' } : q;
const inflOk = () => S.infl && typeof S.infl.rate === 'number' && isFinite(S.infl.rate);
const infl = () => typeof S.inflOv === 'number' ? S.inflOv : (inflOk() ? S.infl.rate : 0);

async function refresh(){
  const syms = [...new Set(allLines().filter(l => l.m).map(l => l.sym))];
  if(!S.url || !syms.length) return;
  failed = false;
  try{
    const a = await api({ symbols:syms.join(',') });
    const q = {};
    for(const s in a.quotes) q[s] = a.quotes[s].error ? a.quotes[s] : norm(a.quotes[s]);
    const cur = [...new Set(Object.values(q).map(x => x.currency).filter(c => c && c !== 'EUR'))];
    const fx = { EUR:1 };
    if(cur.length){
      const b = await api({ symbols:cur.map(c => c + 'EUR=X').join(',') });
      cur.forEach(c => { const x = b.quotes[c + 'EUR=X']; fx[c] = x && x.price ? x.price : null; });
    }
    M = { q, fx, t:Date.now() }; ls.set('pf.q', M);
  }catch(e){ failed = true; }
  const t = document.activeElement && document.activeElement.tagName;
  if(t !== 'INPUT' && t !== 'SELECT') render();
}

function toast(t){
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const x = h('div', { class:'toast', role:'status' }, t); document.body.append(x); setTimeout(() => x.remove(), 3800);
}
function closeModal(){ $('#modal-root').replaceChildren(); }
function openModal(title, bodyEl){
  const content = h('div', { class:'modal-content' },
    h('div', { style:'display:flex;justify-content:space-between;align-items:center;margin-bottom:14px' },
      h('h3', { style:'margin:0;font-size:18px' }, title),
      h('button', { class:'btn alt', style:'padding:4px 10px;font-size:14px', onclick:closeModal }, '✕')),
    bodyEl);
  $('#modal-root').replaceChildren(h('div', { class:'modal-overlay', onclick:e => { if(e.target === e.currentTarget) closeModal(); } }, content));
}

const go = x => { location.hash = x; };
const back = (href, t) => h('button', { class:'link', onclick:() => go(href) }, '‹ ' + t);
const fld = (lab, i, full) => h('div', { class:full ? 'full' : null }, h('label', null, lab), i);

function head(title, a){
  const pv = a.v - a.c;
  return h('div', null, h('h1', null, title), h('div', { class:'total' }, E0.format(a.v)),
    h('div', { class:'sub' },
      a.c && Math.abs(pv) >= 0.5 ? h('span', { class:cls(pv) }, sg(pv) + ' (' + P.format(pv / a.c) + ')') : null,
      a.dv ? h('span', { class:'up', style:'font-weight:600' }, `+ ${E0.format(a.dv)} dividendes`) : null));
}

function row(n, m, x, href){
  const pv = x.v - x.c;
  return h('button', { class:'row', onclick:() => go(href) },
    h('div', { class:'l' }, h('div', { class:'n' }, n), h('div', { class:'m' }, m)),
    h('div', { class:'r' }, h('div', { class:'n' }, E0.format(x.v)),
      x.c && Math.abs(pv) >= 0.5 ? h('div', { class:'m ' + cls(pv) }, sg(pv) + ' (' + P.format(pv / x.c) + ')') : null));
}

const manV = e => e.lines.filter(l => !l.m).reduce((a, l) => a + ((val(l) || { v:0 }).v), 0);
const fp = e => e.lines.reduce((a, l) => { const x = val(l); return a + (l.m && x ? x.v * (l.fee || 0) / 100 : 0); }, 0) + manV(e) * (e.fee || 0) / 100;
const fx = e => e.lines.reduce((a, l) => a + (l.m ? (l.fix || 0) : 0), 0) + (e.fix || 0);
const fees = e => fp(e) + fx(e);
const taxe = e => { const a = agg(e.lines); return Math.max(0, a.v - a.c) * (e.tax || 0) / 100; };
const sums = es => es.reduce((o, e) => { o.p += fp(e); o.x += fx(e); o.f += fees(e); o.t += taxe(e); return o; }, { p:0, x:0, f:0, t:0 });

/* ---------- Onglet 1 : Patrimoine ---------- */
function vHome(){
  const L = allLines(), a = agg(L), pv = a.v - a.c;
  const sNow = sums(S.envs), netNow = a.v - sNow.t, sup = netNow / (1 + infl() / 100);

  const d = h('div', null,
    h('div', { style:'display:flex;justify-content:space-between;align-items:center;margin-bottom:12px' },
      h('div', { style:'display:flex;align-items:center;gap:8px' },
        h('h1', { style:'margin:0;font-size:22px;color:var(--ink)' }, 'Patrimoine'),
        h('span', { style:'width:8px;height:8px;border-radius:50%;background:' + (S.url ? 'var(--up)' : 'var(--warn)'), title: S.url ? 'Relais connecté' : 'Relais non configuré' })),
      h('div', { style:'display:flex;gap:8px' },
        h('button', { class:'btn alt', style:'padding:6px 12px;font-size:13px', onclick: () => openSettingsModal() }, '⚙ Réglages'),
        h('button', { class:'btn', style:'padding:6px 12px;font-size:13px', onclick: () => openAddEnvModal() }, '+ Ajouter'))),

    h('div', { class:'card', style:'padding:16px' },
      h('div', { class:'m' }, 'Patrimoine Net Réel'),
      h('div', { class:'total up', style:'font-size:34px' }, E0.format(netNow)),
      h('div', { style:'display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)' },
        h('span', { class:'m' }, 'Patrimoine brut'), h('span', { class:'n' }, E0.format(a.v))),
      h('div', { class:'note', style:'margin-top:8px' }, 'Pouvoir d’achat (inflation ' + fr1(infl()) + ' %) : ' + E0.format(sup))));

  if(a.v) d.append(h('div', { class:'tiles' },
    h('div', { class:'tile' },
      h('div', { class:'k' }, 'Plus-value latente'),
      h('div', { class:'v ' + cls(pv) }, sg(pv)),
      h('div', { class:'s' }, a.c ? P.format(pv / a.c) + ' sur ' + E0.format(a.c) : '')),
    h('div', { class:'tile' },
      h('div', { class:'k' }, 'Dividendes perçus'),
      h('div', { class:'v up' }, E0.format(a.dv)),
      h('div', { class:'s' }, a.c && a.dv ? PP.format(a.dv / a.c) + ' du capital investi' : 'Sur actions individuelles'))));

  const cs = CLASSES.map((c, i) => { const es = classEnvs(c); return { c, i, n:es.length, x:agg(es.flatMap(e => e.lines)) }; }).filter(o => o.n).sort((p, q) => q.x.v - p.x.v);
  if(cs.length){
    d.append(h('h2', null, 'Répartition'));
    if(a.v) d.append(h('div', { class:'seg' }, ...cs.filter(o => o.x.v > 0).map(o => h('i', { style:'flex:' + o.x.v + ';background:var(--c' + o.i + ')' }))));
    const card = h('div', { class:'card list', style:'margin-top:12px' });
    cs.forEach(o => {
      const p = o.x.v - o.x.c;
      card.append(h('button', { class:'row', onclick:() => go('#/c/' + o.i) },
        h('span', { class:'dot', style:'background:var(--c' + o.i + ')' }),
        h('div', { class:'l' }, h('div', { class:'n' }, o.c), h('div', { class:'m' }, (a.v ? P0.format(o.x.v / a.v) : '0 %') + ' du portefeuille')),
        h('div', { class:'r' }, h('div', { class:'n' }, E0.format(o.x.v)), o.x.c && Math.abs(p) >= 0.5 ? h('div', { class:'m ' + cls(p) }, sg(p)) : null)));
    });
    d.append(card, h('h2', null, 'Mes Enveloppes'));
    const el = h('div', { class:'card list' });
    S.envs.map(e => [e, agg(e.lines)]).sort((p, q) => q[1].v - p[1].v)
      .forEach(([e, x]) => {
        const subMeta = TYPES[e.type].c + (a.v ? ' · ' + P0.format(x.v / a.v) : '') + (x.dv > 0 ? ' · +' + E0.format(x.dv) + ' divs' : '');
        el.append(row(e.name, subMeta, x, '#/e/' + e.id));
      });
    d.append(el);
  } else {
    d.append(h('div', { class:'card', style:'margin-top:16px;padding:20px;text-align:center' },
      h('div', { class:'empty' }, 'Aucune enveloppe. Ajoutez un Livret A, un PEA ou une Assurance-Vie pour débuter.'),
      h('button', { class:'btn', style:'margin-top:12px', onclick: openAddEnvModal }, 'Créer ma première enveloppe')));
  }
  return d;
}

function openAddEnvModal(){
  const sel = h('select', null, ...Object.entries(TYPES).map(([k, t]) => h('option', { value:k }, t.n)));
  const body = h('div', { class:'form' },
    fld('Type d’enveloppe ou d’actif', sel, 1),
    h('button', { class:'btn full', onclick:() => {
      const k = sel.value, n = S.envs.filter(e => e.type === k).length, id = uid();
      S.envs.push({ id, type:k, name:TYPES[k].n + (n ? ' ' + (n + 1) : ''), lines:[] });
      save(); closeModal(); go('#/e/' + id);
    } }, 'Créer l’enveloppe'));
  openModal('Ajouter une enveloppe', body);
}

function openSettingsModal(){
  const u = h('input', { type:'url', placeholder:'https://script.google.com/macros/s/…/exec', value: S.url || '' });
  const body = h('div', { class:'form' },
    fld('URL du relais Google Apps Script', u, 1),
    h('button', { class:'btn full', onclick:() => { S.url = u.value.trim(); save(); closeModal(); refresh(); toast('Réglages enregistrés'); } }, 'Enregistrer'),

function vClass(i){

  return h('div', null, back('#/', 'Patrimoine'), head(c, a), h('h2', null, 'Enveloppes'), card);
}

function vEnv(id){
  const e = S.envs.find(x => x.id === id); if(!e) return vHome();
  const t = TYPES[e.type], a = agg(e.lines);
  const d = h('div', null, back('#/c/' + CLASSES.indexOf(t.c), t.c), head(e.name, a));

  if(a.dv > 0){
    d.append(h('div', { class:'card', style:'padding:12px 16px;margin-top:12px;display:flex;justify-content:space-between;align-items:center;background:rgba(19,121,91,0.06)' },
      h('div', null, h('div', { class:'n up' }, `+ ${E0.format(a.dv)}`), h('div', { class:'m' }, 'Dividendes perçus dans cette enveloppe')),
      h('div', { class:'badge green' }, 'Dividendes')));
  }

  if(e.type === 'av'){
    const avRate = numIn('ex: 2.5'); if(e.avRate != null) avRate.value = e.avRate;
    const projectVal = y => a.v * Math.pow(1 + (pf(avRate.value) || 0)/100, y);
    d.append(h('div', { class:'card', style:'padding:14px;margin-top:14px' },
      h('div', { class:'n' }, 'Rémunération actuelle Assurance-Vie'),
      h('div', { class:'m', style:'margin-bottom:8px' }, 'Taux net de frais de gestion proposé par l’assureur'),
      h('div', { style:'display:flex;gap:8px;align-items:center' }, fld('Taux net annuel (%)', avRate),
        h('button', { class:'btn', style:'margin-top:18px', onclick:() => { e.avRate = pf(avRate.value); save(); render(); toast('Taux AV enregistré'); } }, 'OK')),
      avRate.value ? h('div', { class:'tiles', style:'margin-top:10px' },
        h('div', { class:'tile' }, h('div', { class:'k' }, 'Gain sur 1 an'), h('div', { class:'v up' }, E0.format(projectVal(1) - a.v))),
        h('div', { class:'tile' }, h('div', { class:'k' }, 'Valeur à 8 ans'), h('div', { class:'v' }, E0.format(projectVal(8))))) : null));
  }

  d.append(h('h2', null, 'Lignes d’actifs'));
  const card = h('div', { class:'card list' });
  e.lines.map(l => [l, val(l)]).sort((p, q) => (q[1] ? q[1].v : 0) - (p[1] ? p[1].v : 0)).forEach(([l, x]) => {
    const dv = divs(l);
    const typeLabel = l.m ? (l.assetType === 'etf_acc' ? 'ETF Acc' : l.assetType === 'etf_dist' ? 'ETF Dist' : l.isEtf ? 'ETF' : 'Action') : null;
    const meta = [
      typeLabel,
      l.isEtf && l.fee ? l.fee + '% frais' : null,
      dv > 0 ? '+ ' + E0.format(dv) + ' divs' : null,
      x && a.v ? P0.format(x.v / a.v) : null
    ].filter(Boolean).join(' · ');
    card.append(row(l.name, meta, x || { v:0, c:0 }, '#/l/' + e.id + '/' + l.id));
  });
  if(!e.lines.length) card.append(h('div', { class:'empty' }, 'Aucun actif dans cette enveloppe.'));
  d.append(card);

  if(!t.m){
    d.append(h('h2', null, 'Ajouter une position manuelle'),
      h('div', { class:'card' }, manualForm(e.type, l => { e.lines.push(l); save(); render(); })));
  } else {
    d.append(h('h2', null, 'Ajouter un titre coté'), searchBox(e));
  }

  /* Bouton de suppression enveloppe : Rouge avec texte blanc net */
  d.append(h('button', { class:'btn danger full', style:'margin-top:24px', onclick:() => {
    confirmModal('Supprimer l’enveloppe', 'Supprimer définitivement l’enveloppe « ' + e.name + ' » et tous ses actifs ?', () => {
      S.envs = S.envs.filter(x => x !== e); save(); go('#/');
    });
  } }, 'Supprimer cette enveloppe'));
  return d;
}

function manualForm(type, done){
  const t = TYPES[type], nm = h('input', { type:'text', placeholder:'Nom (ex: Livret, Appartement)' }), v = numIn(), c = numIn();
  return h('div', { class:'form' },
    fld('Intitulé', nm, 1), fld('Montant actuel (€)', v), t.nc ? null : fld('Prix d’achat / Versements (€)', c),
    h('button', { class:'btn full', onclick:() => {
      const val = pf(v.value), cst = t.nc ? val : (pf(c.value) || val);
      if(!nm.value.trim() || !(val >= 0)) return;
      done({ id:uid(), name:nm.value.trim(), val, cst, divs:[] });
    } }, 'Ajouter la position'));
}

function searchBox(e){
  const box = h('div', { class:'list' });
  const inp = h('input', { type:'search', placeholder:'Rechercher (ex: Total, CW8, Air Liquide, Apple)...' });
  inp.oninput = async () => {
    const q = inp.value.trim(); if(q.length < 2) return;
    try {
      const { results } = await api({ action:'search', q });
      box.replaceChildren(...results.map(r => h('button', { class:'row', onclick:() => pick(r) },
        h('div', { class:'l' }, h('div', { class:'n' }, r.name), h('div', { class:'m' }, r.symbol)), h('div', { class:'badge' }, r.type))));
    } catch(x){}
  };
  const pick = r => {
    const qty = numIn('Nombre de parts'), cost = numIn('Prix d’achat unitaire (€)');
    const selType = h('select', null,
      h('option', { value:'stock' }, 'Action individuelle (dividendes perçus)'),
      h('option', { value:'etf_acc' }, 'ETF Capitalisant / Acc (dividendes réinvestis)'),
      h('option', { value:'etf_dist' }, 'ETF Distribuant (dividendes versés)'),
      h('option', { value:'other' }, 'Autre actif coté'));
    
    if(r.type === 'ETF') selType.value = 'etf_acc';
    const fee = numIn('Frais %/an (si ETF)');

    box.replaceChildren(h('div', { class:'form' },
      h('div', { class:'full n' }, r.name),
      fld('Nombre de parts', qty),
      fld('Prix d’achat (€)', cost),
      fld('Nature du titre', selType, 1),
      fld('Frais de gestion annuels (%/an)', fee, 1),
      h('button', { class:'btn full', onclick:() => {
        const n = pf(qty.value), c = pf(cost.value); if(!(n > 0)) return;
        const isEtf = selType.value.startsWith('etf');
        e.lines.push({
          id:uid(), m:1, sym:r.symbol, name:r.name, qty:n, cost:c,
          assetType: selType.value,
          isEtf: isEtf,
          fee: isEtf ? (pf(fee.value) || 0) : 0,
          divs:[]
        });
        save(); render(); refresh();
      } }, 'Valider l’ajout')));
  };
  return h('div', { class:'card list' }, h('div', { style:'padding:10px' }, inp), box);
}

/* Modale de confirmation réutilisable avec bouton rouge et texte blanc */
function confirmModal(title, message, onConfirm){
  const body = h('div', { style:'text-align:center' },
    h('p', { style:'line-height:1.5;margin-bottom:18px' }, message),
    h('div', { class:'btns' },
      h('button', { class:'btn danger full', onclick:() => { closeModal(); onConfirm(); } }, 'Confirmer la suppression'),
      h('button', { class:'btn alt full', onclick:closeModal }, 'Annuler')));
  openModal(title, body);
}

/* Page d'une position individuelle avec SUIVI DES DIVIDENDES D'ACTIONS */
function vLine(eid, lid){
  const e = S.envs.find(x => x.id === eid), l = e && e.lines.find(x => x.id === lid); if(!l) return vHome();
  const x = val(l) || { v:0, c:0, d:0 };
  const dv = divs(l);
  const totalGain = (x.v + dv) - x.c;
  const perfWithDiv = x.c > 0 ? (totalGain / x.c) * 100 : null;
  const yoc = x.c > 0 ? (dv / x.c) * 100 : 0;
  const isAccEtf = l.assetType === 'etf_acc';

  const d = h('div', null, back('#/e/' + eid, e.name), head(l.name, { v:x.v, c:x.c, dv:dv }));

  /* Synthèse visuelle du titre */
  d.append(h('div', { class:'tiles' },
    h('div', { class:'tile' },
      h('div', { class:'k' }, 'Total des dividendes perçus'),
      h('div', { class:'v up' }, E0.format(dv)),
      h('div', { class:'s' }, x.c > 0 && dv > 0 ? fr1(yoc) + ' % du capital investi (YoC)' : (isAccEtf ? 'Réinvestis dans l’ETF' : 'Aucun dividende encore perçu'))),
    h('div', { class:'tile' },
      h('div', { class:'k' }, 'Gain total réel (PV + Divs)'),
      h('div', { class:'v ' + cls(totalGain) }, sg(totalGain)),
      h('div', { class:'s' }, perfWithDiv != null ? (perfWithDiv >= 0 ? '+' : '') + fr1(perfWithDiv) + ' % de rentabilité globale' : ''))));

  /* Bloc d'explication pour les ETF Capitalisants */
  if(isAccEtf){
    d.append(h('div', { class:'card', style:'padding:14px;margin-top:14px;border-left:4px solid var(--accent)' },
      h('div', { class:'n' }, 'ETF Capitalisant (Acc)'),
      h('div', { class:'m', style:'margin-top:4px' },
        'Cet ETF réinvestit automatiquement l’intégralité des dividendes des entreprises au sein de la valeur de sa part. Vous n’avez pas besoin de saisir manuellement les dividendes reçus : vos gains se reflètent directement dans la plus-value latente.'),
      h('button', { class:'link', style:'margin-top:6px;font-size:13px', onclick:() => {
        l.assetType = 'stock'; save(); render(); toast('Mode basculé en versement de dividendes');
      } }, 'Changer pour un titre versant des dividendes en cash')));
  }

  /* Configuration du titre coté */
  if(l.m){
    const feeI = numIn(); feeI.value = l.fee || '';
    const selNature = h('select', null,
      h('option', { value:'stock' }, 'Action individuelle (dividendes perçus)'),
      h('option', { value:'etf_acc' }, 'ETF Capitalisant (Acc - réinvestissement auto)'),
      h('option', { value:'etf_dist' }, 'ETF Distribuant (Dist - dividendes versés)'));
    selNature.value = l.assetType || (l.isEtf ? 'etf_acc' : 'stock');

    d.append(h('h2', null, 'Configuration du Titre'),
      h('div', { class:'card form' },
        fld('Type de position', selNature, 1),
        fld('Frais de gestion annuels de l’ETF (% / an)', feeI, 1),
        h('button', { class:'btn full', onclick:() => {
          l.assetType = selNature.value;
          l.isEtf = selNature.value.startsWith('etf');
          l.fee = l.isEtf ? (pf(feeI.value) || 0) : 0;
          save(); render(); toast('Configuration enregistrée');
        } }, 'Enregistrer la configuration')));
  }

  /* Section Dividendes pour actions individuelles et ETF distribuants */
  if(!isAccEtf){
    d.append(h('h2', null, 'Dividendes d’actions perçus'));

    /* Formulaire rapide pour renseigner un nouveau dividende */
    const divAmt = numIn('Montant net reçu (€)'), divDate = h('input', { type:'date', value: new Date().toISOString().slice(0,10) });
    d.append(
      h('div', { class:'card form' },
        fld('Date de réception', divDate),
        fld('Montant net perçu (€)', divAmt),
        h('button', { class:'btn full', onclick:() => {
          const amt = pf(divAmt.value);
          if(!(amt > 0) || !divDate.value){ divAmt.focus(); return; }
          l.divs = l.divs || [];
          l.divs.push({ id:uid(), amt, d:divDate.value });
          save(); render(); toast('Dividende de ' + E2.format(amt) + ' enregistré !');
        } }, '+ Enregistrer ce dividende perçu')));

    /* Liste des dividendes déjà enregistrés */
    const divCard = h('div', { class:'card list', style:'margin-top:12px' });
    (l.divs || []).slice().sort((a,b) => b.d.localeCompare(a.d)).forEach((dd, idx) => {
      divCard.append(h('div', { class:'row' },
        h('div', { class:'l' },
          h('div', { class:'n up' }, `+ ${E2.format(dd.amt)}`),
          h('div', { class:'m' }, new Date(dd.d).toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' }))),
        h('button', { class:'btn-del', onclick:() => {
          l.divs.splice(idx, 1);
          save(); render(); toast('Dividende retiré');
        } }, 'Supprimer')));
    });
    if(!(l.divs && l.divs.length)){
      divCard.append(h('div', { class:'empty' }, 'Aucun dividende encore perçu. Saisissez-les dès réception ci-dessus.'));
    }
    d.append(divCard);
  }

  /* Bouton de suppression de position avec texte blanc et confirmation */
  d.append(h('button', { class:'btn danger full', style:'margin-top:24px', onclick:() => {
    confirmModal('Supprimer la position', 'Supprimer définitivement la position « ' + l.name + ' » et tout son historique de dividendes ?', () => {
      e.lines = e.lines.filter(z => z !== l); save(); go('#/e/' + eid);
    });
  } }, 'Supprimer cette position'));
  return d;
}

  const nm = h('input', { type:'text', placeholder:'Ex: Taxe Foncière, Assurance' }), amt = numIn('Montant annuel (€)');
  const body = h('div', { class:'form' },
    fld('Intitulé de la dépense annuelle', nm, 1), fld('Montant total annuel (€)', amt, 1),
    h('button', { class:'btn full', onclick:() => {
      const v = pf(amt.value); if(!nm.value.trim() || !(v > 0)) return;
      (B.bills = B.bills || []).push({ id:uid(), name:nm.value.trim(), amt:v });
      save(); closeModal(); render(); toast('Dépense ajoutée');
    } }, 'Ajouter au calculateur'));
  openModal('Ajouter une facture annuelle', body);
}

function compoundCard(){
  const c0I = numIn('Capital de départ'), pI = numIn('Versement mensuel'), rI = numIn('Rendement %'), nI = intIn('Durée en années');
  c0I.value = Math.round(agg(allLines()).v); pI.value = 200; rI.value = 5; nI.value = 20;
  const out = h('div');
  const upd = () => {
    const c0 = pf(c0I.value)||0, p = pf(pI.value)||0, r = pf(rI.value)||0, n = Math.min(50, pf(nI.value)||1);
    let tot = c0, invested = c0;
    for(let i=0; i<n*12; i++){ tot = tot * (1 + r/100/12) + p; invested += p; }
    out.replaceChildren(h('div', { class:'tiles', style:'margin-top:10px' },
      h('div', { class:'tile' }, h('div', { class:'k' }, 'Capital final'), h('div', { class:'v up' }, E0.format(tot))),
      h('div', { class:'tile' }, h('div', { class:'k' }, 'Intérêts gagnés'), h('div', { class:'v' }, E0.format(tot - invested)))));
  };
  [c0I, pI, rI, nI].forEach(x => x.oninput = upd);
  setTimeout(upd, 50);
  return h('div', { class:'card form' }, fld('Capital de départ (€)', c0I), fld('Versement mensuel (€)', pI), fld('Rendement annuel (%)', rI), fld('Horizon (années)', nI), out);
}

function render(){
  const r = (location.hash || '#/').slice(2).split('/');
  const k = r[0];
  const V = { c:vClass, e:vEnv, l:vLine, n:vNet, s:vStrat, g:vGoals, u:vTools }[k] || vHome;
  $('#app').replaceChildren(V(...r.slice(1)));
  navR(k);
}

function navR(k){
  const cur = k === 'n' ? 1 : k === 's' ? 2 : k === 'g' ? 3 : k === 'u' ? 4 : 0;
  const items = [
    ['Patrimoine', '#/', '<svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>'],
    ['Frais', '#/n', '<svg viewBox="0 0 24 24"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1H6.8c.1 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-5.18-4.4z"/></svg>'],
    ['Stratégie', '#/s', '<svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>'],
    ['Objectifs', '#/g', '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>'],
    ['Budget', '#/u', '<svg viewBox="0 0 24 24"><path d="M19 3H5c-1.11 0-2 .89-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.11-.9-2-2-2zm0 16H5V7h14v12zm-2-7h-4v-2h4v2z"/></svg>']
  ];
  $('#nav').replaceChildren(...items.map(([n, hr, ic], i) =>
    h('a', { href:hr, 'aria-current':i === cur ? 'page' : null },
      h('span', { innerHTML: ic }), h('span', null, n))));
}

window.onhashchange = () => { render(); window.scrollTo(0, 0); };
render(); refresh();
setInterval(refresh, 5 * 60 * 1000);
</script>
</body>
